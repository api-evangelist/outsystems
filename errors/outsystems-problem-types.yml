format_note: >-
  The ODC APIs return an ASP.NET Core `ProblemDetails` object carrying the RFC 7807 /
  RFC 9457 member set — `type`, `title`, `status`, `detail`, `instance` — plus a
  `traceId` extension. It is NOT served as `application/problem+json`: every one of the
  597 declared error responses uses `application/json`. So the ODC error contract is
  Problem-Details-SHAPED but not RFC 9457 CONFORMANT on the media type, which is the
  discriminator a client uses to detect a problem document. Recorded honestly rather
  than claimed as rfc9457.
