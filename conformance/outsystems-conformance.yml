    Error bodies use the RFC 7807/9457 member set (type/title/status/detail/instance
    plus a traceId extension) via an ASP.NET Core ProblemDetails schema, but all 597
    declared error responses are served as application/json, never
    application/problem+json. Shape yes, media type no.
- id: rfc9116-security-txt
  conforms: partial
  evidence: >-
    PGP-signed security.txt served at https://www.outsystems.com/.well-known/security.txt
