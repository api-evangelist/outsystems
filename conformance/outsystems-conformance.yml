- id: oidc
  conforms: true
  evidence: >-
    "The ODC REST APIs use the OpenID Connect (OIDC) protocol for authorization and
    authentication, which is based on the OAuth 2.0 framework." Discovery document
    served at /identity/.well-known/openid-configuration per tenant.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: partial
  evidence: >-
    OIDC discovery is served at the tenant path /identity/.well-known/openid-configuration
    rather than at the RFC 8414 /.well-known/oauth-authorization-server location; the
    public marketing host returns 403 for both.
- id: jwt-bearer
  conforms: true
  evidence: securitySchemes bearerAuth type http, scheme bearer, bearerFormat JWT across all 13 specs
- id: rfc9457-problem-details
  conforms: false
