apis:
- aid: outsystems:remote-mcp
  name: OutSystems Remote MCP Server
  description: >-
    Official OutSystems remote Model Context Protocol server (early alpha), exposed per tenant over streamable
    HTTP with OAuth Dynamic Client Registration. Tool domains cover Apps, the read-only Context Service
    lookups, the Mentor OML editing session, Publish, Deployments, External libraries and Environments.
  humanURL: https://github.com/OutSystems/outsystems-mcp
  baseURL: https://{tenant}.outsystems.dev/mcp
  tags:
  - Model Context Protocol
  - Artificial Intelligence
  - Agents
  properties:
  - type: MCPServer
    url: mcp/outsystems-mcp.yml
  - type: ToolCrosswalk
    url: mcp/outsystems-tool-crosswalk.yml
