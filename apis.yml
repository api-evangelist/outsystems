aid: outsystems
name: OutSystems
x-enrichment:
  date: '2026-08-02'
  status: enriched
  artifacts_added: 54
  pass: local-v1
description: 'OutSystems is an enterprise low-code and AI-assisted application development
  platform company, founded in 2001 and headquartered in Boston, Massachusetts with
  engineering in Lisbon, Portugal. Its two product lines are OutSystems 11 (O11), the
  self-managed/PaaS platform, and OutSystems Developer Cloud (ODC), the cloud-native
  successor. ODC publishes a documented set of public REST APIs covering user and access
  management, portfolio, asset repository, asset and environment configurations, build
  operations, deployments, dependency and impact analysis, code quality, native mobile
  builds, external library generation, and subscription/entitlement usage. All ODC REST
  APIs authenticate with OAuth 2.0 client-credentials via a per-tenant OIDC discovery
  document, use offset/limit pagination, and are rate limited per API domain. OutSystems
  also ships a remote MCP server (early alpha) that exposes app inspection, the Mentor
  OML editing session, publishing, deployments, external libraries and environments to
  AI coding agents.'
